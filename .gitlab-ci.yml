image: maven:3.9.6-eclipse-temurin-21

stages:
  - test
  - deploy
  - verify

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

variables:
  APP: backend
  DEPLOY_PATH: /home/user11/app/patipets-backend

test:
  stage: test
  script:
    - mvn test
  only:
    - develop

deploy:
  stage: deploy
  image: alpine:latest
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$VPS_SSH_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
  script:
    - ssh -i "$VPS_SSH_KEY" $VPS_USER@$VPS_HOST "
        set -e
        echo '=== [1/4] Pull latest code ==='
        cd $DEPLOY_PATH
        git checkout develop
        git pull origin develop

        echo '=== [2/4] Export env vars ==='
        set -a
        source /home/user11/app/.env
        set +a

        echo '=== [3/4] Build and restart ==='
        docker compose build $APP
        docker compose up -d $APP

        echo '=== [4/4] Cleanup ==='
        docker image prune -f
      "
    - echo "DEPLOY_SHA=$CI_COMMIT_SHORT_SHA" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  only:
    - develop

verify:
  stage: verify
  image: alpine:latest
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl
  script:
    - sleep 15
    - |
      curl -sf http://200.13.4.215:8080/api/v1/health \
        && echo 'Health check passed' \
        || (echo 'Health check failed' && exit 1)
    - |
      curl -sf http://200.13.4.215:8080/api/v1/animales \
        && echo 'API responding' \
        || (echo 'API not responding' && exit 1)
  only:
    - develop
