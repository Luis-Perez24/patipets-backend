image: maven:3.9.6-eclipse-temurin-21

stages:
  - test
  - deploy
  - verify

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

variables:
  APP: backend
  DEPLOY_PATH: /home/user11/app/patipets-backend

test:
  stage: test
  script:
    - mvn test
  only:
    - develop

# Deploy via SSH (VPS_SSH_KEY es base64 de la clave privada, tipo Variable) y Ubuntu 20.04
deploy:
  stage: deploy
  image: ubuntu:20.04
  variables:
    GIT_STRATEGY: none
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client > /dev/null 2>&1
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "DEBUG VPS_SSH_KEY length=${#VPS_SSH_KEY}"
    - echo "$VPS_SSH_KEY" | base64 -d > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
    - echo "DEBUG deploy_key lineas=$(wc -l < ~/.ssh/deploy_key) bytes=$(wc -c < ~/.ssh/deploy_key)"
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
  script:
    - ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST "
        set -e
        echo '=== [1/5] Pull latest code ==='
        cd $DEPLOY_PATH
        git checkout develop
        git fetch --prune origin develop
        git reset --hard origin/develop

        echo '=== [2/5] Export env vars ==='
        set -a
        source /home/user11/app/.env
        set +a

        echo '=== [3/5] Stop existing containers ==='
        export COMPOSE_PROJECT_NAME=patipets
        cd $DEPLOY_PATH
        docker compose -f $DEPLOY_PATH/docker-compose.yml down 2>/dev/null || true

        echo '=== [4/5] Build and restart ==='
        docker compose -f $DEPLOY_PATH/docker-compose.yml build --no-cache $APP
        docker compose -f $DEPLOY_PATH/docker-compose.yml up -d --remove-orphans

        echo '=== [5/5] Cleanup ==='
        docker image prune -f
      "
    - echo "DEPLOY_SHA=$CI_COMMIT_SHORT_SHA" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  only:
    - develop

verify:
  stage: verify
  image: alpine:latest
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl
  script:
    - sleep 60
    - |
      curl -sf http://200.13.4.215:8080/actuator/health \
        && echo 'Health check passed' \
        || (echo 'Health check failed' && exit 1)
    - |
      curl -sf http://200.13.4.215/ \
        && echo 'Frontend reachable' \
        || (echo 'Frontend not reachable' && exit 1)
  only:
    - develop
