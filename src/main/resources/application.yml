spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:54322/postgres
    username: postgres
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8080

notificaciones:
  email:
    remitente: no-reply@patipets.cl

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

supabase:
  url: http://127.0.0.1:54321
  public-url: ${SUPABASE_PUBLIC_URL:http://127.0.0.1:54321}
  key: ${SUPABASE_SERVICE_KEY}
  bucket: ${SUPABASE_STORAGE_BUCKET:patipets}
