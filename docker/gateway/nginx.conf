# Puerta de entrada a Supabase Storage.
#
# En el Supabase completo este rol lo cumple Kong, que enruta `/storage/v1/*`
# hacia el contenedor de storage y expone ademas auth, realtime y postgrest.
# Este proyecto solo usa Storage, asi que correr Kong significaria mantener un
# API gateway completo —con su base de configuracion declarativa— para una
# unica ruta. Nginx hace lo mismo en unas pocas lineas y ya es la imagen que el
# frontend usa para servir el estatico, de modo que no agrega una tecnologia
# nueva al stack.
#
# El prefijo importa: el backend construye las URL como
# `{SUPABASE_URL}/storage/v1/object/...`, la misma forma que usa el CLI de
# Supabase en local. La barra final del `proxy_pass` es la que quita el prefijo
# antes de llegar a storage-api, que sirve las rutas como `/object/...`.

server {
    listen 80;
    server_name _;

    # Las fotos se comprimen a 800x800 JPG antes de subir, pero el limite del
    # bucket es 50 MB: si nginx cortara antes, el error saldria como 413 de
    # nginx en vez del mensaje de Storage.
    client_max_body_size 50m;

    location /storage/v1/ {
        proxy_pass http://storage:5000/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las subidas viajan en una sola pasada; sin esto nginx las bufferea
        # completas en disco antes de reenviarlas.
        proxy_request_buffering off;
    }

    # Fuera de `/storage/v1/` no hay nada que enrutar. Se corta aca en vez de
    # dejar el default de nginx sirviendo su pagina de bienvenida.
    #
    # Lo que si queda expuesto bajo ese prefijo son los endpoints de escritura y
    # de administracion de buckets. No se filtran por ruta porque storage-api ya
    # los protege por si mismo: sin header Authorization rechaza la peticion, y
    # con un token de rol `anon` la corta la politica de row-level security de
    # la tabla `storage.objects`. Solo el token de `service_role` —el que tiene
    # el backend— puede escribir. Lo unico que se sirve sin credencial es
    # `/object/public/...`, que es justamente lo que el navegador necesita para
    # mostrar las fotos.
    location / {
        return 404;
    }
}
