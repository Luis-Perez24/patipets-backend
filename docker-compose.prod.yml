# docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    build:
      context: ./docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  storage:
    image: supabase/storage-api:v1.19.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:?falta SUPABASE_JWT_SECRET}
      ANON_KEY: ${SUPABASE_ANON_KEY:?falta SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?falta SUPABASE_SERVICE_KEY}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: '52428800'
      TENANT_ID: patipets
      REGION: local
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes:
      - storage-data:/var/lib/storage

  storage-bootstrap:
    image: curlimages/curl:8.11.1
    restart: 'no'
    exclude_from_hc: true
    depends_on:
      - storage
    environment:
      SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
    entrypoint: ['sh', '-c']
    command:
      - |
        for i in $$(seq 1 30); do
          curl -s -o /tmp/post -X POST \
            -H "Authorization: Bearer $$SERVICE_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"id":"patipets","name":"patipets","public":true,"file_size_limit":52428800,"allowed_mime_types":["image/jpeg","image/png","image/webp"]}' \
            http://storage:5000/bucket || true

          code=$$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $$SERVICE_KEY" \
            http://storage:5000/bucket/patipets) || true

          if [ "$$code" = "200" ]; then
            echo "bucket patipets listo"; exit 0
          fi
          echo "storage aun no responde, reintento $$i"; sleep 5
        done
        echo 'no se pudo crear el bucket; ultima respuesta del POST:'
        cat /tmp/post; exit 1

  gateway:
    build:
      context: ./docker/gateway
    restart: unless-stopped
    depends_on:
      - storage

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      SUPABASE_URL: http://gateway
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:?falta SUPABASE_PUBLIC_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_STORAGE_BUCKET: patipets
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'

  frontend:
    build:
      context: https://github.com/Luis-Perez24/patipets-frontend.git#59536ddb307d103f217bf3bf400f4035ab017a01
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
      - gateway

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped

volumes:
  db-data:
  storage-data:
